# Render Blueprint para el backend CatálogoBulk
# Documentación: https://render.com/docs/blueprint-spec
#
# NOTA: El bloque `databases` del blueprint no soporta `type: redis`, así que
# el Redis se crea a mano en el Dashboard y su REDIS_URL se pega aquí como
# variable (ver instrucciones). MONGO_URI y JWT_SECRET se configuran igual.

services:
  - type: web
    name: catalogobulk-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3000"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "1h"
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: BATCH_SIZE
        value: "500"
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: IMPORT_ERRORS_CAP
        value: "1000"
      - key: REDIS_URL
        sync: false

  - type: worker
    name: catalogobulk-worker
    runtime: node
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: PORT
        value: "3000"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "1h"
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: BATCH_SIZE
        value: "500"
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: IMPORT_ERRORS_CAP
        value: "1000"
      - key: REDIS_URL
        sync: false
