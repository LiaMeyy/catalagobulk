services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/catalogobulk
      - REDIS_HOST=redis
      - REDIS_URL=
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongo
      - redis

  worker:
    build: .
    command: ["node", "src/workers/import.worker.js"]
    env_file: .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/catalogobulk
      - REDIS_HOST=redis
      - REDIS_URL=
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mongo_data:
  uploads_data:
